<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explore | City Explorer Guayaquil</title>
  <meta name="description" content="Browse curated places in Guayaquil with filters and favorites.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/siteplan.css">
  <script src="/scripts/siteplan.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="brand">
      <a href="siteplan-index.html" class="logo">🌆 City Explorer</a>
    </div>
    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <ul>
        <li><a href="siteplan-index.html">Home</a></li>
        <li><a href="siteplan-explore.html" aria-current="page">Explore</a></li>
        <li><a href="siteplan-contact.html">Contact</a></li>
        <li class="theme"><button id="themeToggle" aria-pressed="false">Toggle theme</button></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <header class="page-header">
      <h1>Explore places</h1>
      <p>Filter by category, sort by rating, and save your favorites.</p>
    </header>

    <section class="controls" aria-labelledby="controls-title">
      <h2 id="controls-title">Controls</h2>
      <div class="control-row">
        <label for="category">Category</label>
        <select id="category" name="category">
          <option value="all">All</option>
          <option value="food">Food</option>
          <option value="park">Park</option>
          <option value="culture">Culture</option>
        </select>

        <label for="sort">Sort</label>
        <select id="sort" name="sort">
          <option value="rating-desc">Rating (high to low)</option>
          <option value="rating-asc">Rating (low to high)</option>
          <option value="name-asc">Name (A-Z)</option>
        </select>

        <label for="query">Search</label>
        <input id="query" name="query" type="search" placeholder="Type to filter…">
      </div>
    </section>

    <section class="cards" aria-labelledby="cards-title">
      <h2 id="cards-title">Results</h2>
      <div id="cardGrid" class="grid" role="list"></div>
      <p id="emptyState" class="empty" hidden>No matches. Try another filter.</p>
    </section>

    <section class="favorites" aria-labelledby="favorites-title">
      <h2 id="favorites-title">Your favorites</h2>
      <ul id="favoritesList" class="favorites-list"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> City Explorer Guayaquil.</p>
    <p><a href="siteplan-sp.html">Site plan</a> · <a href="siteplan-references.html">References</a></p>
  </footer>
</body>
</html>
